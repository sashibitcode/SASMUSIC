    <!-- Independent Full-Screen Native Splash Screen (2.5s Hold + Loading Bar + 500ms Smooth Dissolve) -->
    <style>
      @keyframes splashLoading {
        0% { width: 0%; opacity: 0.6; }
        25% { width: 35%; opacity: 0.85; }
        65% { width: 75%; opacity: 0.95; }
        100% { width: 100%; opacity: 1; }
      }
    </style>
    <div id="app-splash" style="position:fixed;inset:0;background-color:#06110c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,24px)+36px) 24px calc(env(safe-area-inset-bottom,16px)+36px);z-index:99999;transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1),transform 0.5s cubic-bezier(0.16,1,0.3,1);user-select:none;-webkit-user-select:none;cursor:pointer;">
      <div></div>

      <!-- Center Official Brand Logo with atmospheric glow & loading indicator -->
      <div style="display:flex;flex-direction:column;align-items:center;position:relative;">
        <div style="position:absolute;width:260px;height:130px;background:rgba(163,28,27,0.32);filter:blur(55px);border-radius:50%;pointer-events:none;"></div>
        <img src="/sas-music-logo-red.png" alt="SAS Music" style="width:220px;max-width:68vw;height:auto;position:relative;z-index:1;" />
        
        <!-- Luxury Animated Loading Bar -->
        <div style="width:130px;height:3px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;margin-top:24px;">
          <div style="height:100%;background:linear-gradient(90deg,#A31C1B,#e2403f,#ffffff);border-radius:9999px;animation:splashLoading 2.5s cubic-bezier(0.2,0.8,0.2,1) forwards;box-shadow:0 0 10px rgba(163,28,27,0.85);"></div>
        </div>
      </div>

      <!-- Bottom Studio Brand Signature (Elevated by 38px for comfortable optical balance) -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-bottom:38px;">
        <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.25em;color:#94a3b8;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">from</span>
        <span style="font-size:13px;font-weight:800;letter-spacing:0.22em;color:#ffffff;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">SASHIBITCODE</span>
      </div>
    </div>

    <!-- Splash Screen Timing & Transition Controller -->
    <script>
      (function() {
        var splash = document.getElementById('app-splash');
        if (!splash) return;

        var dismissed = false;
        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          splash.style.opacity = '0';
          splash.style.transform = 'scale(1.05)';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 550);
        }

        // Tap-to-dismiss: user can tap to proceed immediately if desired
        splash.addEventListener('click', dismiss);
        splash.addEventListener('touchstart', dismiss, { passive: true });

        // Guaranteed hold time of 2.5 seconds so users comfortably read the brand & see loading
        setTimeout(dismiss, 2500);
      })();
    </script>
